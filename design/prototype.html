<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Грош</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F2F2F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&icon_names=account_balance,account_balance_wallet,add,add_circle,adjust,animation,auto_awesome,autorenew,backspace,backup,bar_chart,bedtime,calculate,calendar_month,cancel,category,celebration,check,check_circle,checkroom,chevron_left,chevron_right,child_care,close,cloud_sync,content_copy,content_cut,contrast,credit_card,delete,diamond,directions_bus,directions_walk,do_not_disturb_on,download,edit_calendar,emoji_events,error,event,event_available,fitness_center,flag,flight,help,history,home,hub,laptop_mac,lightbulb,local_bar,local_cafe,local_fire_department,local_gas_station,local_taxi,lock,logout,mail,mark_email_read,medication,menu_book,military_tech,more_horiz,movie,music_note,north_east,percent,person,pets,radio_button_unchecked,receipt_long,redeem,remove,restaurant,savings,school,search,self_improvement,settings,shield,shopping_cart,smartphone,south_west,sports_esports,sync,table_view,task_alt,trending_down,trending_up,unfold_more,upload,vibration,visibility,visibility_off,work&display=block">
<link rel="stylesheet" href="ds.css">
<style>
  html, body { height: 100%; }
  body { overflow: hidden; }
  #root { height: 100%; }
  /* приложение прибито к видимой области: низ с таб-баром не уезжает под панели браузера */
  .app { position: fixed; inset: 0; height: auto; }
  .boot { height: 100%; display: grid; place-items: center; color: var(--label-2); }

  .screen { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); animation: fade-in var(--dur-3) var(--ease-out) both; }
  .inner { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-content: start; }
  .inner .large-title { padding: calc(52px + env(safe-area-inset-top, 0px)) 0 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: -12px; }
  .col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-content: start; min-width: 0; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-content: start; }


  .hero { display: grid; gap: 2px; padding: 0 4px; }
  .hero__v { font-family: var(--font-rounded); font-size: 48px; font-weight: 700; letter-spacing: -.5px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .hero__v small { font-size: 28px; color: var(--label-2); font-weight: 600; margin-left: 4px; }

  .chal { display: grid; gap: 8px; flex: 1; min-width: 0; }
  .chal__row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .chal__state { font-size: var(--t-footnote); letter-spacing: -.08px; }

  .cell-wrap { position: relative; overflow: hidden; display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--dur-3) var(--ease-ios), opacity var(--dur-3); }
  .cell-wrap > div { min-height: 0; position: relative; overflow: hidden; }
  .cell-wrap.is-gone { grid-template-rows: 0fr; opacity: 0; }
  .swipe-del { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 20px; background: var(--red); color: #fff; font-weight: 500; opacity: 0; }
  .cell-wrap.is-drag .swipe-del { opacity: 1; }
  .cell-wrap .cell { touch-action: pan-y; }
  .more { color: var(--tint); justify-content: center; }

  /* шторка операции */
  .tx { --accent: var(--red); display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
  .tx--income { --accent: var(--green); }
  .amount { text-align: center; padding: 4px 0; }
  .amount__expr { font-size: var(--t-subhead); color: var(--label-2); min-height: 20px; font-variant-numeric: tabular-nums; }
  .amount__val { font-family: var(--font-rounded); font-weight: 700; font-size: 52px; letter-spacing: -.5px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .amount__val .cur { color: var(--label-3); font-size: 34px; margin-left: 4px; }
  .tx--income .amount__val { color: var(--green); }
  .amount.is-shake { animation: shake 400ms var(--ease-ios); }
  .picks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 4px; }
  .pick { display: grid; justify-items: center; gap: 5px; font-size: var(--t-caption1); letter-spacing: 0; color: var(--label-2); min-width: 0; }
  .pick span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick .sq { transition: outline-color var(--dur-2); outline: 2.5px solid transparent; outline-offset: 2px; }
  .pick[aria-pressed="true"] { color: var(--label); font-weight: 600; }
  .pick[aria-pressed="true"] .sq { outline-color: var(--c); }
  .row-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .row-scroll::-webkit-scrollbar { display: none; }
  .sheet__body:has(> .tx) { display: flex; flex-direction: column; }
  .sheet__body > .tx { flex: 1; min-height: auto; }
  .date-cap { position: relative; }
  .date-cap input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .tx .pad { margin-top: auto; }

  /* календарь */
  .cal-card { padding: 12px 8px 8px; }
  .cal-head { display: flex; align-items: center; gap: 4px; padding: 0 8px 12px; }
  .cal-head b { flex: 1; font-size: var(--t-title3); font-weight: 600; letter-spacing: .38px; }
  .cal-head b span { text-transform: capitalize; }
  .cal-anim-l { animation: slide-l var(--dur-4) var(--ease-ios) both; }
  .cal-anim-r { animation: slide-r var(--dur-4) var(--ease-ios) both; }
  @keyframes slide-l { from { transform: translateX(32px); opacity: 0; } }
  @keyframes slide-r { from { transform: translateX(-32px); opacity: 0; } }
  .cal-wrap { touch-action: pan-y; overflow: hidden; }
  .cal-sum { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 10px 16px 2px; font-size: var(--t-footnote); color: var(--label-2); border-top: var(--hair) solid var(--sep); margin: 8px -8px 0; }
  .cal-sum b { font-weight: 600; color: var(--label); font-variant-numeric: tabular-nums; }

  /* статистика */
  .period { display: flex; align-items: center; gap: 8px; }
  .period b { flex: 1; text-align: center; font-weight: 600; }
  .metric__label { font-size: var(--t-footnote); color: var(--label-2); text-transform: uppercase; letter-spacing: -.08px; }
  .metric__v { font-family: var(--font-rounded); font-size: 34px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .metric__v small { font-size: 20px; color: var(--label-2); margin-left: 3px; font-weight: 600; }
  .metric__sub { font-size: var(--t-subhead); color: var(--label-2); }
  .chart { position: relative; height: 170px; display: flex; align-items: flex-end; gap: 3px; padding-right: 40px; }
  .chart__grid { position: absolute; left: 0; right: 0; border-top: var(--hair) solid var(--sep); pointer-events: none; }
  .chart__grid span { position: absolute; right: 0; top: -7px; font-size: var(--t-caption2); color: var(--label-2); font-variant-numeric: tabular-nums; }
  .chart__avg { position: absolute; left: 0; right: 40px; border-top: 1px dashed var(--c); pointer-events: none; opacity: .7; }
  .bar { flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; position: relative; z-index: 1; }
  .bar i { display: block; width: 100%; height: calc(var(--h) * 100%); min-height: 1px; border-radius: 3px 3px 1px 1px; background: var(--c); transform-origin: bottom; animation: grow-y var(--dur-4) var(--ease-ios) both; animation-delay: calc(var(--i) * 12ms); transition: opacity var(--dur-2); }
  .chart.has-sel .bar:not(.is-sel) i { opacity: .35; }
  .bar.is-future i { background: var(--fill-3); }
  .chart__labels { display: flex; gap: 3px; padding-right: 40px; font-size: var(--t-caption2); color: var(--label-2); font-variant-numeric: tabular-nums; }
  .chart__labels span { flex: 1; min-width: 0; text-align: center; overflow: visible; white-space: nowrap; }
  .stackbar { display: flex; gap: 2px; height: 14px; border-radius: 4px; overflow: hidden; background: var(--fill-3); }
  .stackbar i { display: block; height: 100%; background: var(--c); width: calc(var(--p) * 100%); transform-origin: left; animation: grow-x var(--dur-4) var(--ease-ios) both; animation-delay: calc(var(--i) * 60ms); transition: opacity var(--dur-2); }
  .stackbar.has-sel i:not(.is-sel) { opacity: .3; }
  .legend .cell.is-dim { opacity: .4; }
  .delta-good { color: var(--green); }
  .delta-bad { color: var(--red); }

  /* награды */
  .award-sum { display: flex; align-items: center; gap: 18px; }
  .big-ring { width: 96px; height: 96px; flex: none; position: relative; }
  .big-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .big-ring circle { fill: none; stroke-width: 12; }
  .big-ring b { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-family: var(--font-rounded); font-size: 24px; line-height: 1; }
  .big-ring b small { font-family: var(--font); font-size: 11px; font-weight: 500; color: var(--label-2); margin-top: 3px; }
  .badges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px 8px; padding: 18px 8px; }
  .badge-cell { display: grid; justify-items: center; align-content: start; gap: 6px; text-align: center; min-width: 0; transition: transform var(--dur-2) var(--ease-spring); }
  .badge-cell:active { transform: scale(.94); }
  .badge-cell b { font-size: var(--t-footnote); font-weight: 600; line-height: 1.2; letter-spacing: -.08px; }
  .badge-cell small { font-size: var(--t-caption1); color: var(--label-2); line-height: 1.2; letter-spacing: 0; }
  .ach-hero { display: grid; justify-items: center; gap: 8px; text-align: center; perspective: 800px; padding: 8px 0 4px; }
  .ach-hero .badge { animation: badge-in 1s var(--ease-out) both; }

  /* страницы (push-навигация) */
  .page { position: absolute; inset: 0; z-index: 35; background: var(--bg); overflow-y: auto; padding-bottom: 60px; animation: push-in var(--dur-4) var(--ease-ios) both; }
  .page.is-closing { animation: push-out var(--dur-3) var(--ease-ios) both; }
  @keyframes push-in { from { transform: translateX(100%); } }
  @keyframes push-out { to { transform: translateX(100%); } }
  .back { display: inline-flex; align-items: center; color: var(--tint); margin-left: -10px; }
  .back .ms { font-size: 32px; width: auto; }
  .cell .seg { width: 176px; flex: 0 1 auto; min-width: 0; }
  .cell__main { overflow-wrap: anywhere; }
  .profile-head { display: grid; justify-items: center; gap: 10px; text-align: center; padding-top: 8px; }
  .name-input { font-size: var(--t-title1); font-weight: 700; text-align: center; border: 0; background: transparent; width: 100%; max-width: 320px; padding: 2px 8px; border-radius: 8px; letter-spacing: .36px; }
  .name-input:focus { outline: none; background: var(--fill-4); }
  .showcase { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 16px 8px; gap: 8px; }
  .slot { display: grid; justify-items: center; align-content: start; gap: 6px; font-size: var(--t-footnote); text-align: center; min-width: 0; }
  .slot--empty { color: var(--tint); }
  .slot--empty .ring-empty { width: 64px; height: 64px; border-radius: 50%; border: 1.5px dashed var(--label-3); display: grid; place-items: center; }
  .code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; letter-spacing: 0; background: var(--bg-2); border-radius: var(--r-group); padding: 12px 16px; max-height: 160px; overflow: auto; white-space: pre; color: var(--label-2); }

  /* итоги месяца */
  .recap { position: absolute; inset: 0; z-index: 80; display: grid; place-items: center; background: #000; animation: fade-in var(--dur-3) var(--ease-out) both; }
  .story { --c: var(--indigo); position: relative; width: 100%; height: 100%; overflow: hidden; color: #fff; background: var(--c); transition: background var(--dur-4) var(--ease-ios); user-select: none; }
  .story--orange { --c: var(--orange); } .story--pink { --c: var(--pink); } .story--green { --c: var(--green); } .story--teal { --c: var(--teal); } .story--indigo { --c: var(--indigo); }
  .story__bars { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 12px; right: 12px; display: flex; gap: 4px; z-index: 3; }
  .story__bars span { flex: 1; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .35); overflow: hidden; }
  .story__bars i { display: block; height: 100%; background: #fff; width: 0; }
  .story__bars .is-done i { width: 100%; }
  .story__bars .is-cur i { animation: story-fill 6s linear forwards; }
  .story.is-paused .story__bars .is-cur i { animation-play-state: paused; }
  @keyframes story-fill { to { width: 100%; } }
  .story__close { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 22px); right: 12px; z-index: 4; color: #fff; background: rgba(255, 255, 255, .22); }
  .story__tap { position: absolute; inset: 0; z-index: 2; display: grid; grid-template-columns: 1fr 2fr; }
  .story__body { position: absolute; inset: 0; z-index: 1; padding: 80px 28px 48px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .story__body > * { animation: rise 600ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 110ms + 80ms); }
  .story__eyebrow { font-size: var(--t-footnote); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; opacity: .85; }
  .story__big { font-family: var(--font-rounded); font-weight: 700; font-size: clamp(40px, 12vw, 58px); line-height: 1; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .story__title { font-family: var(--font-rounded); font-weight: 700; font-size: clamp(52px, 16vw, 80px); line-height: .95; letter-spacing: -1px; text-transform: capitalize; }
  .story__title span { display: inline-block; animation: letter 700ms var(--ease-spring) both; animation-delay: calc(var(--l) * 40ms + 200ms); }
  @keyframes letter { from { transform: translateY(50%); opacity: 0; } }
  .story__txt { font-size: var(--t-title3); font-weight: 500; line-height: 1.3; letter-spacing: .38px; max-width: 26ch; }
  .story__txt b { font-weight: 700; }
  .story__icon { width: 88px; height: 88px; border-radius: 22px; background: rgba(255, 255, 255, .22); display: grid; place-items: center; }
  .story__icon .ms { font-size: 54px; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 48; }
  .story__rows { display: grid; gap: 12px; }
  .story__row { display: grid; gap: 6px; font-size: var(--t-body); }
  .story__row > div:first-child { display: flex; justify-content: space-between; gap: 8px; }
  .story__row .progress { background: rgba(255, 255, 255, .25); height: 6px; border-radius: 3px; }
  .story__row .progress i { background: #fff; }
  .story__cmp { display: flex; align-items: flex-end; gap: 16px; height: 190px; }
  .story__cmp > div { flex: 1; display: grid; gap: 8px; align-content: end; height: 100%; text-align: center; font-size: var(--t-subhead); }
  .story__cmp i { display: block; border-radius: 10px 10px 4px 4px; background: #fff; height: calc(var(--h) * 140px); transform-origin: bottom; animation: grow-y 900ms var(--ease-spring) both; animation-delay: var(--d); }
  .story__cmp > div:first-child i { background: rgba(255, 255, 255, .4); }
  .story__badges { display: flex; flex-wrap: wrap; gap: 16px; }
  .story__badges .badge { --c: #fff; }
  .story__badges .badge__core { background: rgba(255, 255, 255, .25); }
  .story__badges .badge__track { stroke: rgba(255, 255, 255, .25); }
  .story__badges > div { animation: badge-in 900ms var(--ease-out) both; animation-delay: calc(var(--i) * 120ms + 300ms); }
  .story__road { position: relative; height: 56px; border-bottom: 2px dashed rgba(255, 255, 255, .45); overflow: hidden; }
  .story__road .ms { position: absolute; bottom: 4px; left: 0; font-size: 44px; width: auto; animation: drive 3s var(--ease-ios) .4s both; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 48; }
  @keyframes drive { from { transform: translateX(-60px); } to { transform: translateX(min(380px, 80vw)); } }
  .story .btn { position: relative; z-index: 3; background: #fff; color: var(--c); align-self: flex-start; }

  /* новая награда */
  .unlock { position: absolute; inset: 0; z-index: 90; display: grid; place-items: center; background: var(--scrim); animation: fade-in var(--dur-3) var(--ease-out) both; perspective: 900px; }
  .unlock.is-closing { animation: fade-out var(--dur-3) var(--ease-ios) both; }
  .unlock__card { position: relative; overflow: hidden; display: grid; justify-items: center; gap: 8px; text-align: center; width: min(340px, calc(100% - 40px)); padding: 32px 20px 20px; border-radius: 22px; background: var(--bg-2); animation: alert-in 560ms var(--ease-spring) both; }
  @keyframes alert-in { from { transform: scale(1.15); opacity: 0; } }
  .unlock .badge { animation: badge-in 1.1s var(--ease-out) both; margin-bottom: 8px; }
  .unlock p { color: var(--label-2); font-size: var(--t-subhead); letter-spacing: -.24px; max-width: 28ch; }
  .unlock canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
  .unlock__taxi { position: absolute; left: 0; top: 100px; z-index: 1; color: var(--yellow); font-size: 40px; width: auto; animation: drive 2.4s var(--ease-ios) .5s both; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 48; }

  /* вход и регистрация */
  .auth { position: absolute; inset: 0; z-index: 85; background: var(--bg); overflow-y: auto; animation: sheet-in var(--dur-4) var(--ease-ios) both; }
  .auth.is-closing { animation: sheet-out var(--dur-3) var(--ease-ios) both; }
  .auth__inner { position: relative; max-width: 440px; min-height: 100%; margin: 0 auto; padding: calc(60px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; }
  .auth__top { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; }
  .auth__step { flex: 1; display: flex; flex-direction: column; gap: 18px; animation: auth-in var(--dur-4) var(--ease-ios) both; }
  .auth__step.is-back { animation-name: auth-back; }
  @keyframes auth-in { from { transform: translateX(40px); opacity: 0; } }
  @keyframes auth-back { from { transform: translateX(-40px); opacity: 0; } }
  .auth__hero { display: grid; justify-items: center; gap: 10px; text-align: center; padding-top: 12px; }
  .auth__hero p { color: var(--label-2); max-width: 30ch; }
  .app-icon { width: 88px; height: 88px; border-radius: 20px; background: var(--tint); color: #fff; display: grid; place-items: center; animation: alert-pop 600ms var(--ease-spring) both; }
  .app-icon .ms { font-size: 54px; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 48; }
  .auth__head { display: grid; gap: 6px; }
  .auth__head p { color: var(--label-2); }
  .auth__fields { display: grid; gap: 12px; }
  .auth__fields.is-shake { animation: shake 400ms var(--ease-ios); }
  .auth__actions { display: grid; gap: 10px; margin-top: auto; padding-top: 8px; }
  .auth__or { display: flex; align-items: center; gap: 12px; color: var(--label-2); font-size: var(--t-footnote); }
  .auth__or::before, .auth__or::after { content: ""; flex: 1; border-top: var(--hair) solid var(--sep); }
  .auth__foot { text-align: center; font-size: var(--t-subhead); color: var(--label-2); letter-spacing: -.24px; }
  .auth__note { text-align: center; font-size: var(--t-caption1); color: var(--label-3); letter-spacing: 0; }
  .link { color: var(--tint); font: inherit; }
  .btn--apple { background: var(--label); color: var(--bg-2); }
  .btn--filled .spinner i, .btn--apple .spinner i { background: currentColor; }
  .strength { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 8px 16px 0; }
  .strength i { height: 4px; border-radius: 2px; background: var(--fill-3); transition: background var(--dur-3); }
  .strength i.on { background: var(--c); }
  .pw-toggle { color: var(--label-3); display: grid; place-items: center; width: 30px; height: 30px; }
  .action-sheet__group > :first-child { border-top: 0; }

  /* десктоп */
  @container app (min-width: 900px) {
    .auth { background: var(--scrim); display: grid; place-items: center; padding: 24px; animation: fade-in var(--dur-3) var(--ease-out) both; }
    .auth.is-closing { animation: fade-out var(--dur-3) var(--ease-ios) both; }
    .auth__inner { width: 440px; min-height: 0; max-height: 100%; overflow-y: auto; padding: 56px 32px 24px; background: var(--bg); border-radius: 14px; animation: modal-pop var(--dur-4) var(--ease-ios) both; }
    @keyframes modal-pop { from { transform: scale(1.06); opacity: 0; } }
    .screen { padding: 0 0 48px 260px; }
    .page { left: 260px; }
    .inner { max-width: 1040px; padding: 0 40px; }
    .split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }

const instSchedule = it => { const base = Math.round(it.total / it.months), day = parse(it.first).getDate(); return [...Array(it.months)].map((_, k) => ({ k, date: addMonths(it.first, k, day), amount: k === it.months - 1 ? it.total - base * (it.months - 1) : base })); };

function depState(dp, txs, until = TODAY) {
  const ops = txs.filter(t => t.dep === dp.id && t.type === 'transfer' && !t.deletedAt).sort((a, b) => a.date.localeCompare(b.date));

  for (let d = parse(dp.start); iso(d) <= end; d = addDays(d, 1)) {

function useCount(target, dur = 800, fromZero = false) {
  const [v, setV] = useState(fromZero ? 0 : target);
  const prev = useRef(fromZero ? 0 : target);
  useEffect(() => {
    const from = prev.current, to = target; prev.current = to;
    if (from === to || store.s.settings.motion === 'reduced') { setV(to); return; }
    let raf, t0;
    const step = t => { t0 ??= t; const p = Math.min(1, (t - t0) / dur); setV(from + (to - from) * (1 - Math.pow(1 - p, 3))); if (p < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return v;
}

/* ================= шторка: новая операция ================= */
const evalExpr = s => s.split(/(?=[+−])/).reduce((a, t) => a + (t[0] === '−' ? -1 : 1) * (+t.replace(/[+−]/, '') || 0), 0);
function TxSheet({ tx, preset, close }) {
  const s = store.s;
  const [type, setType] = useState(tx?.type || preset?.type || 'expense');
  const [expr, setExpr] = useState(tx ? String(tx.amount) : '');
  const [cat, setCat] = useState(tx?.cat || null);
  const [date, setDate] = useState(tx?.date || preset?.date || TODAY);
  const [note, setNote] = useState(tx?.note || '');
  const [shake, setShake] = useState(0);
  const cats = s.categories.filter(c => c.type === type && !c.archived).sort((a, b) => a.order - b.order);
  // последние использованные категории — первыми
  const recent = useMemo(() => { const m = {}; s.tx.filter(t => !t.deletedAt && t.type === type).slice(-60).forEach((t, i) => (m[t.cat] = i)); return m; }, [type]);
  const sorted = [...cats].sort((a, b) => (recent[b.id] ?? -1) - (recent[a.id] ?? -1));
  const amount = Math.max(0, evalExpr(expr));
  const hasOp = /[+−]/.test(expr);
  useEffect(() => { if (cat && !cats.some(c => c.id === cat)) setCat(null); }, [type]);

  const press = k => {
    buzz(4);
    setExpr(e => {
      if (k === 'C') return '';
      if (k === '⌫') return e.slice(0, -1);
      if (k === '+' || k === '−') return !e || '+−'.includes(e.at(-1)) ? e : e + k;
      if (e.length >= 14) return e;
      if ((e === '' || '+−'.includes(e.at(-1))) && (k === '0' || k === '000')) return e;
      return e + k;
    });
  };
  const fail = msg => { setShake(x => x + 1); buzz([10, 30, 10]); ui.toast(msg, null, 'error'); };
  const save = () => {
    if (!amount) return fail('Введите сумму');
    if (!cat) return fail('Выберите категорию');
    const data = { type, amount: Math.round(amount), cat, date, note: note.trim() };
    if (hasOp) store.set(st => ({ meta: { ...st.meta, calcUsed: true } }));
    close();
    setTimeout(() => {
      if (tx) { updTx(tx.id, data); ui.toast('Изменения сохранены'); }
      else { addTx(data); ui.toast(`${catOf(cat).name}: ${type === 'income' ? '+' : '−'}${money(data.amount)}`); }
      buzz(12);
    }, 220);
  };
  const keys = ['1', '2', '3', '⌫', '4', '5', '6', '+', '7', '8', '9', '−', '000', '0', 'C'];
  const digits = fmt(amount).split('');
  return html`
    <${SheetNav} title=${tx ? 'Запись' : type === 'income' ? 'Новый доход' : 'Новый расход'} onCancel=${close} done=${tx ? 'Готово' : 'Добавить'} onDone=${save} />
    <div class="sheet__body">
      <div class=${'tx' + (type === 'income' ? ' tx--income' : '')}>
        <${Seg} items=${[['expense', 'Расход'], ['income', 'Доход']]} value=${type} onChange=${setType} />
        <div class=${'amount' + (shake % 2 ? ' is-shake' : '')} key=${'sh' + shake}>
          <div class="amount__expr">${hasOp ? expr.replace(/([+−])/g, ' $1 ') + ' =' : ''}</div>
          <div class="amount__val">${type === 'income' ? '+' : ''}${digits.join('')}<span class="cur">₸</span></div>
        </div>
        <div class="picks">
          ${sorted.slice(0, 8).map(c => html`<button class="pick" style=${`--c:var(--${c.color})`} aria-pressed=${String(c.id === cat)} onClick=${() => { buzz(6); setCat(c.id); }}><${Sq} c=${c} size="md" /><span>${c.name}</span></button>`)}
        </div>
        <div class="row-scroll">
          ${sorted.slice(8).map(c => html`<button class="capsule" aria-pressed=${String(c.id === cat)} onClick=${() => setCat(c.id)}><${Icon} n=${c.icon} fill />${c.name}</button>`)}
        </div>
        <div class="row-scroll">
          <button class="capsule" aria-pressed=${String(date === TODAY)} onClick=${() => setDate(TODAY)}>Сегодня</button>
          <button class="capsule" aria-pressed=${String(date === YESTERDAY)} onClick=${() => setDate(YESTERDAY)}>Вчера</button>
          <label class="capsule date-cap" aria-pressed=${String(date !== TODAY && date !== YESTERDAY)}><${Icon} n="calendar_month" />${date !== TODAY && date !== YESTERDAY ? dateLong(date) : 'Дата'}
            <input type="date" id="tx-date" value=${date} max=${TODAY} onInput=${e => e.target.value && setDate(e.target.value)} aria-label="Дата" /></label>
        </div>
        <input class="field" id="tx-note" placeholder="Заметка" value=${note} onInput=${e => setNote(e.target.value)} />
        ${tx && html`<button class="btn btn--destructive" onClick=${() => { close(); setTimeout(() => delTx(tx), 220); }}>Удалить запись</button>`}
        <div class="pad" style=${`--accent:var(--${type === 'income' ? 'green' : 'tint'})`}>
          ${keys.map(k => html`<button class=${'key' + ('⌫+−'.includes(k) ? ' key--op' : '')} onClick=${() => press(k)} aria-label=${k === '⌫' ? 'Стереть' : k}>${k === '⌫' ? html`<${Icon} n="backspace" />` : k}</button>`)}
          <button class="key key--ok" style="grid-column:4;grid-row:4" onClick=${save} aria-label="Сохранить"><${Icon} n="check" /></button>
        </div>
      </div>
    </div>`;
}

/* ================= главная ================= */
function TxRow({ t }) {
  const c = catOf(t.cat);
  const st = useRef(null), swiped = useRef(false);
  const [dx, setDx] = useState(0), [drag, setDrag] = useState(false), [gone, setGone] = useState(false);
  const down = e => { st.current = { x: e.clientX, y: e.clientY, dx: 0, lock: null }; swiped.current = false; };
  const move = e => {
    const o = st.current; if (!o) return;
    const ddx = e.clientX - o.x, ddy = e.clientY - o.y;
    if (o.lock === null && (Math.abs(ddx) > 8 || Math.abs(ddy) > 8)) { o.lock = Math.abs(ddx) > Math.abs(ddy) ? 'x' : 'y'; if (o.lock === 'x') { e.currentTarget.setPointerCapture(e.pointerId); setDrag(true); } }
    if (o.lock === 'x') { o.dx = Math.min(0, ddx); setDx(o.dx); if (o.dx < -110 && !o.armed) { o.armed = true; buzz(10); } }
  };
  const up = () => {
    const o = st.current; st.current = null; setDrag(false); if (!o) return;
    if (o.lock === 'x') { swiped.current = true; if (o.dx < -110) { setDx(-600); setGone(true); setTimeout(() => delTx(t), 300); } else setDx(0); }
  };
  return html`<div class=${'cell-wrap' + (gone ? ' is-gone' : '') + (dx < 0 ? ' is-drag' : '')}><div>
    <div class="swipe-del">Удалить</div>
    <button class="cell cell--tx" style=${`transform:translateX(${dx}px);transition:${drag ? 'none' : 'transform 420ms cubic-bezier(.32,.72,0,1), background 220ms'}`}
      onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up}
      onClick=${() => { if (swiped.current) return; if (t.type === 'transfer') { const d = (store.s.deposits || []).find(x => x.id === t.dep); d && ui.sheet({ kind: 'dep', d }); } else ui.sheet({ kind: 'tx', tx: t }); }}>
      <${Sq} c=${c} size="md" />
      <span class="cell__main"><span class="cell__title">${c.name}</span><span class="cell__sub">${t.note || (t.type === 'income' ? 'Доход' : 'Без заметки')}</span></span>
      <span class=${'amt' + (t.type === 'income' ? ' amt--in' : '')} style=${t.type === 'transfer' ? 'color:var(--label-2)' : ''}>${t.type === 'income' ? '+' : t.type === 'transfer' ? (t.amount > 0 ? '→ ' : '← ') : '−'}${fmt(Math.abs(t.amount))} ₸</span>
    </button></div></div>`;
}
function Ledger({ txs, limit }) {
  const groups = useMemo(() => {
    const m = new Map();
    [...txs].sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt)).forEach(t => { if (!m.has(t.date)) m.set(t.date, []); m.get(t.date).push(t); });
    return [...m.entries()];
  }, [txs]);
  if (!groups.length) return html`<div class="card" style="text-align:center;justify-items:center"><${Icon} n="receipt_long" style="font-size:40px;color:var(--label-3)" /><b>Записей пока нет</b><span class="secondary t-subhead">Нажмите «+», чтобы добавить первую трату.</span></div>`;
  return html`<div class="col stagger" style="gap:24px">${groups.slice(0, limit).map(([d, list], gi) => {
    const exp = list.filter(t => t.type === 'expense').reduce((a, t) => a + t.amount, 0);
    return html`<div class="section" style=${'--i:' + gi} key=${d}>
      <div class="section__header"><span>${dayTitle(d)}</span><span class="num">${exp ? '−' + fmt(exp) + ' ₸' : ''}</span></div>
      <div class="group">${list.map(t => html`<${TxRow} key=${t.id} t=${t} />`)}</div>
    </div>`;
  })}</div>`;
}
function ChallengeCell({ ch, c, i }) {
  const cat = catOf(ch.cat);

  const spent = c.txs.filter(t => t.cat === ch.cat && t.type === 'expense' && t.date >= a && t.date <= b).reduce((s, t) => s + t.amount, 0);

    <${Sq} c=${cat} />

function rangeFor(mode, off, s) {
  if (mode === 'week') {
    const d = addDays(NOW, -((NOW.getDay() - s.settings.weekStart + 7) % 7) + off * 7);
    const a = iso(d), b = iso(addDays(d, 6));
    return { a, b, label: `${dateLong(a)} — ${dateLong(b)}` };
  }
  if (mode === 'month') {
    const k = pKey(TODAY, s.settings.monthStart) + off;
    const [a, b] = pRange(k, s.settings.monthStart);
    return { a, b, k, label: cap(M_NOM[k % 12]) + ' ' + Math.floor(k / 12) };
  }
  const yy = NOW.getFullYear() + off;
  return { a: `${yy}-01-01`, b: `${yy}-12-31`, label: String(yy) };
}

/* ================= новая награда ================= */
function Confetti() {
  const ref = useRef();
  useEffect(() => {
    if (store.s.settings.motion === 'reduced' || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = ref.current, ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1;

    const cols = ['--orange', '--yellow', '--blue', '--green', '--pink', '--purple'].map(v => st.getPropertyValue(v).trim());
    const P = [...Array(120)].map(() => ({ x: W / 2, y: H * .3, vx: (Math.random() - .5) * 15 * dpr, vy: (-Math.random() * 13 - 4) * dpr, r: (Math.random() * 4 + 3) * dpr, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, va: (Math.random() - .5) * .4, sq: Math.random() < .5 }));
    let raf, t = 0;
    const step = () => {
      t++; ctx.clearRect(0, 0, W, H);
      for (const p of P) { p.vy += .34 * dpr; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - t / 140); if (p.sq) ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); else { ctx.beginPath(); ctx.arc(0, 0, p.r / 1.4, 0, 7); ctx.fill(); } ctx.restore(); }
      if (t < 140) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, []);
  return html`<canvas ref=${ref}></canvas>`;
}

function recapData(s, c, k) {
  const p = c.per.get(k), prev = c.per.get(k - 1);
  const [a, b] = pRange(k, c.ms);
  const txs = c.txs.filter(t => t.date >= a && t.date <= b);
  const cats = Object.entries(p.byCat).sort((x, y) => y[1] - x[1]).map(([id, v]) => ({ cat: catOf(id), v }));
  const dayTot = {};
  txs.filter(t => t.type === 'expense' && t.cat !== 'home').forEach(t => (dayTot[t.date] = (dayTot[t.date] || 0) + t.amount));
  const topDay = Object.entries(dayTot).sort((x, y) => y[1] - x[1])[0];
  const topDayItems = topDay ? txs.filter(t => t.date === topDay[0] && t.type === 'expense').sort((x, y) => y.amount - x.amount).slice(0, 3) : [];
  const { res } = evaluate(s);
  const badges = ACH.filter(x => x.monthly && res[x.id].periods.includes(k)).map(x => [x, res[x.id]]);
  const taxi = p.byCat.taxi || 0, taxiPrev = prev?.byCat.taxi || 0;
  const ch = s.challenges.find(x => x.cat === 'taxi');
  const instPaid = txs.filter(t => t.inst).reduce((x, t) => x + t.amount, 0);
  const deps = (s.deposits || []).filter(d => d.start <= b);
  const depGrow = deps.reduce((x, d) => x + depState(d, c.txs, b).bal - depState(d, c.txs, iso(addDays(parse(a), -1))).bal, 0);
  const depInt = deps.reduce((x, d) => x + depState(d, c.txs, b).interest - depState(d, c.txs, iso(addDays(parse(a), -1))).interest, 0);
  return { k, p, prev, cats, topDay, topDayItems, badges, taxi, taxiPrev, ch, instPaid, depGrow, depInt, n: txs.length, days: diffDays(a, b) + 1 };
}
const Big = ({ v }) => { const x = useCount(v, 1400, true); return html`${fmt(x)} ₸`; };

  const m = k % 12, saved = d.p.inc - d.p.exp, rate = d.p.inc ? Math.round(saved / d.p.inc * 100) : 0;
  const slides = [
    { tone: 'indigo', body: html`<span class="story__eyebrow" style="--i:0">Итоги месяца</span>
        <div class="story__title" style="--i:1">${M_NOM[m].split('').map((ch, l) => html`<span style=${'--l:' + l}>${ch}</span>`)}</div>
        <p class="story__txt" style="--i:2"><b>${d.days} ${plural(d.days, 'день', 'дня', 'дней')}</b> и <b>${d.n} ${plural(d.n, 'запись', 'записи', 'записей')}</b>. Смотрим, куда ушли деньги.</p>` },
    { tone: 'pink', body: html`<span class="story__eyebrow" style="--i:0">Потрачено в ${M_PREP[m]}</span>
        <div class="story__big" style="--i:1"><${Big} v=${d.p.exp} /></div>
        <p class="story__txt" style="--i:2">Заработано <b>${money(d.p.inc)}</b>.</p>
        <div class="story__rows" style="--i:3"><div class="story__row"><div><span>Расход от дохода</span><b>${d.p.inc ? Math.round(d.p.exp / d.p.inc * 100) : 100}%</b></div><div class="progress"><i style=${`--p:${d.p.inc ? Math.min(1, d.p.exp / d.p.inc) : 1};--delay:500ms`}></i></div></div></div>` },
    d.cats[0] && { tone: 'orange', body: html`<span class="story__eyebrow" style="--i:0">Больше всего ушло на</span>
        <div class="story__icon" style="--i:1"><span class="ms">${d.cats[0].cat.icon}</span></div>
        <div class="story__big" style="--i:2;font-size:clamp(34px,10vw,48px)">${d.cats[0].cat.name}</div>
        <p class="story__txt" style="--i:3"><b>${money(d.cats[0].v)}</b>, это ${Math.round(d.cats[0].v / d.p.exp * 100)}% всех трат.</p>
        <div class="story__rows" style="--i:4">${d.cats.slice(1, 4).map((x, j) => html`<div class="story__row"><div><span>${x.cat.name}</span><b class="num">${fmt(x.v)}</b></div><div class="progress"><i style=${`--p:${x.v / d.cats[0].v};--delay:${600 + j * 120}ms`}></i></div></div>`)}</div>` },
    d.topDay && { tone: 'teal', body: html`<span class="story__eyebrow" style="--i:0">Самый дорогой день</span>
        <div class="story__big" style="--i:1">${dateLong(d.topDay[0])}</div>
        <p class="story__txt" style="--i:2">${cap(WD_LONG[parse(d.topDay[0]).getDay()])}, <b>${money(d.topDay[1])}</b> без учёта аренды.</p>
        <div class="story__rows" style="--i:3">${d.topDayItems.map(t => html`<div class="story__row"><div><span>${t.note || catOf(t.cat).name}</span><b class="num">${fmt(t.amount)}</b></div></div>`)}</div>` },
    d.prev && { tone: d.p.exp <= d.prev.exp ? 'green' : 'pink', body: html`<span class="story__eyebrow" style="--i:0">По сравнению с ${M_INS[(k - 1) % 12]}</span>
        <div class="story__big" style="--i:1">${d.p.exp <= d.prev.exp ? '−' : '+'}${Math.abs(Math.round((d.p.exp - d.prev.exp) / d.prev.exp * 100))}%</div>
        <p class="story__txt" style="--i:2">${d.p.exp <= d.prev.exp ? html`Вы потратили на <b>${money(d.prev.exp - d.p.exp)}</b> меньше.` : html`Трат стало больше на <b>${money(d.p.exp - d.prev.exp)}</b>.`}</p>
        <div class="story__cmp" style="--i:3">
          <div><i style=${`--h:${d.prev.exp / Math.max(d.prev.exp, d.p.exp)};--d:500ms`}></i><span>${cap(M_NOM[(k - 1) % 12])}<br /><b class="num">${kfmt(d.prev.exp)}</b></span></div>
          <div><i style=${`--h:${d.p.exp / Math.max(d.prev.exp, d.p.exp)};--d:700ms`}></i><span>${cap(M_NOM[m])}<br /><b class="num">${kfmt(d.p.exp)}</b></span></div>
        </div>` },
    (d.taxi || d.taxiPrev) && { tone: 'orange', body: html`<span class="story__eyebrow" style="--i:0">Такси</span>
        <div class="story__road" style="--i:1"><span class="ms">local_taxi</span></div>
        <div class="story__big" style="--i:2"><${Big} v=${d.taxi} /></div>
        <p class="story__txt" style="--i:3">${d.taxiPrev ? (d.taxi < d.taxiPrev ? html`На <b>${Math.round((1 - d.taxi / d.taxiPrev) * 100)}% меньше</b>, чем в ${M_PREP[(k - 1) % 12]}.` : html`На <b>${Math.round((d.taxi / d.taxiPrev - 1) * 100)}% больше</b>, чем в ${M_PREP[(k - 1) % 12]}.`) : 'Первый месяц с такси в учёте.'}</p>
        ${d.ch && html`<p class="story__txt" style="--i:4;font-size:17px">${d.taxi <= d.ch.limit ? 'Уложились в лимит ' : 'Лимит превышен: '}${money(d.ch.limit)}</p>`}` },
    (d.instPaid || d.depGrow) && { tone: 'green', body: html`<span class="story__eyebrow" style="--i:0">Рассрочки и депозит</span>
        <div class="story__icon" style="--i:1"><span class="ms">account_balance</span></div>
        <div class="story__big" style="--i:2">+<${Big} v=${Math.round(d.depGrow)} /></div>
        <p class="story__txt" style="--i:3">Депозит вырос, из них <b>${money(d.depInt)}</b> — проценты, которые вы не заработали руками.</p>
        ${d.instPaid > 0 && html`<p class="story__txt" style="--i:4;font-size:17px">По рассрочкам выплачено ${money(d.instPaid)}.</p>`}` },
    d.badges.length && { tone: 'indigo', body: html`<span class="story__eyebrow" style="--i:0">Награды за ${M_NOM[m]}</span>
        <div class="story__big" style="--i:1">${d.badges.length} ${plural(d.badges.length, 'награда', 'награды', 'наград')}</div>
        <div class="story__badges" style="--i:2">${d.badges.map(([a, r], j) => html`<div style=${`--i:${j};display:grid;justify-items:center;gap:6px;width:84px;text-align:center;font-size:13px`}><${Badge} a=${a} r=${r} size=${68} /><span>${a.n}</span></div>`)}</div>` },
    { tone: saved > 0 ? 'green' : 'pink', body: html`<span class="story__eyebrow" style="--i:0">${saved > 0 ? 'Отложено' : 'Ушли в минус на'}</span>
        <div class="story__big" style="--i:1"><${Big} v=${Math.abs(saved)} /></div>
        <p class="story__txt" style="--i:2">${saved > 0 ? html`Это <b>${rate}% дохода</b>. ${rate >= 20 ? 'Отличный месяц.' : 'Хорошая база на следующий месяц.'}` : 'Попробуйте челлендж на самую большую категорию.'}</p>
        <button class="btn" style="--i:3" onClick=${e => { e.stopPropagation(); onClose(); }}>Готово</button>` },
  ].filter(Boolean);
  const last = slides.length - 1;
  const go = di => { buzz(4); setI(x => { const n = x + di; if (n > last) { onClose(); return x; } return Math.max(0, n); }); };
  const hold = useRef(0);
  const cur = slides[i];
  return html`<div class="recap">
    <div class=${'story story--' + cur.tone + (paused ? ' is-paused' : '')}>
      <div class="story__bars">${slides.map((_, j) => html`<span class=${j < i ? 'is-done' : j === i ? 'is-cur' : ''}><i key=${'b' + i + j} onAnimationEnd=${() => j === i && i < last && go(1)}></i></span>`)}</div>
      <button class="circle-btn story__close" aria-label="Закрыть итоги" onClick=${onClose}><${Icon} n="close" /></button>
      <div class="story__body" key=${'s' + i}>${cur.body}</div>
      <div class="story__tap" onPointerDown=${() => { hold.current = Date.now(); setPaused(true); }} onPointerUp=${() => setPaused(false)} onPointerLeave=${() => setPaused(false)}>
        <button aria-label="Назад" onClick=${() => Date.now() - hold.current < 250 && go(-1)}></button>
        <button aria-label="Дальше" onClick=${() => Date.now() - hold.current < 250 && go(1)}></button>
      </div>
    </div>
  </div>`;
}

/* ================= настройки и профиль ================= */

const backupJSON = s => JSON.stringify({ app: 'grosh', v: s.v, exportedAt: new Date().toISOString(), profile: s.profile, settings: s.settings, categories: s.categories, challenges: s.challenges, tx: s.tx, meta: { ...s.meta } }, null, 2);

    r.readAsText(f);

    download(`grosh-${TODAY}.csv`, '﻿' + rows.map(r => r.join(';')).join('\n'), 'text/csv');

  const reset = () => ui.dialog({
    title: 'Стереть все данные?', msg: 'Записи, челленджи и награды удалятся с этого устройства. Отменить это нельзя.',
    actions: [{ label: 'Отмена', style: 'bold' }, { label: 'Стереть', style: 'destructive', run: () => { store.set(st => ({ tx: [], challenges: [], meta: { ...st.meta, backups: 0, lastBackupAt: null, calcUsed: false, recapSeen: null, ach: {}, demo: false }, profile: { ...st.profile, showcase: [], since: TODAY } })); ui.toast('Все данные стёрты'); } }],
  });
  const signOut = () => ui.dialog({
    title: 'Выйти из аккаунта?', msg: 'Данные останутся на этом устройстве, синхронизация остановится.',
    actions: [{ label: 'Отмена' }, { label: 'Выйти', style: 'destructive', run: () => { store.set(st => ({ profile: { ...st.profile, account: null } })); ui.toast('Вы вышли из аккаунта'); } }],
  });

  const setMs = d => mutate(st => ({ settings: { ...st.settings, monthStart: Math.min(28, Math.max(1, st.settings.monthStart + d)) } }));

      <span class="avatar avatar--lg" style=${`--c:var(--${s.profile.color})`}>${initials(s.profile.name)}</span>
      <span class="cell__main"><span class="t-title3">${s.profile.name}</span><span class="cell__sub">${acc ? (acc.email || 'Вход через ' + acc.provider) : 'Профиль и витрина наград'}</span></span><${Chev} />
    </button></div>
    ${acc ? html`<div class="section"><div class="section__header">Аккаунт</div><div class="group">
        <div class="cell cell--icon"><${SqI} icon="sync" color="green" /><span class="cell__main">Синхронизация</span><span class="cell__value">Включена</span></div>

      : html`<div class="group"><button class="cell cell--icon" onClick=${() => ui.auth('welcome')}><${SqI} icon="cloud_sync" color="blue" /><span class="cell__main"><span>Войти в Грош</span><span class="cell__sub">Синхронизация между устройствами</span></span><${Chev} /></button></div>`}
    <div class="section"><div class="section__header">Оформление</div><div class="group">
      <div class="cell cell--icon"><${SqI} icon="contrast" color="indigo" /><span class="cell__main">Тема</span><label class="select"><select id="set-theme" aria-label="Тема" value=${s.settings.theme} onChange=${e => set({ theme: e.target.value })}><option value="system">Как в системе</option><option value="light">Светлая</option><option value="dark">Тёмная</option></select></label></div>

      <button class="cell cell--icon" onClick=${() => ui.sheet({ kind: 'challenge' })}><${SqI} icon="flag" color="yellow" /><span class="cell__main">Новый челлендж</span><span class="cell__value">${s.challenges.length}</span><${Chev} /></button>
    </div><div class="section__footer">Если зарплата приходит 10-го, поставьте 10 — статистика и итоги будут считаться с 10-го по 9-е.</div></div>

    </div><div class="section__footer">Данные хранятся только на этом устройстве. Бэкап — это файл JSON, его можно загрузить обратно на любом устройстве.</div></div>

/* ================= рассрочка и депозит ================= */
const digitsOnly = v => { const d = String(v).replace(/\D/g, '').slice(0, 10); return d ? fmt(+d) : ''; };
const numOf = v => +String(v).replace(/\D/g, '') || 0;
function InstSheet({ it, close }) {
  const isNew = !it;
  const [name, setName] = useState(it?.name || '');
  const [total, setTotal] = useState(it ? fmt(it.total) : '');
  const [months, setMonths] = useState(it?.months || 12);
  const [first, setFirst] = useState(it?.first || TODAY);
  const [pb, setPb] = useState(it?.paidBefore || 0);
  const tot = numOf(total);
  const st = it ? instState(it, store.s.tx.filter(t => !t.deletedAt)) : null;
  const save = () => {
    if (!name.trim()) return ui.toast('Введите название покупки', null, 'error');
    if (tot < 1000) return ui.toast('Сумма от 1 000 ₸', null, 'error');
    close();
    const data = { name: name.trim(), total: tot, months, first, paidBefore: Math.min(pb, months) };
    mutate(s0 => { const list = isNew ? [...(s0.installments || []), { id: uid(), createdAt: Date.now(), ...data }] : s0.installments.map(x => (x.id === it.id ? { ...x, ...data } : x)); return { installments: list, tx: [...s0.tx, ...instDue({ ...s0, installments: list })] }; });
    ui.toast(isNew ? `Рассрочка: ${money(Math.round(tot / months))} в месяц` : 'Рассрочка сохранена');
  };
  const del = () => ui.dialog({ title: 'Удалить рассрочку?', msg: 'Уже списанные платежи останутся в расходах.', actions: [{ label: 'Отмена', style: 'bold' }, { label: 'Удалить', style: 'destructive', run: () => { close(); store.set(s0 => ({ installments: s0.installments.filter(x => x.id !== it.id) })); ui.toast('Рассрочка удалена'); } }] });
  return html`<${SheetNav} title=${isNew ? 'Новая рассрочка' : it.name} onCancel=${close} done=${isNew ? 'Добавить' : 'Готово'} onDone=${save} />
    <div class="sheet__body">
      ${st && html`<div class="card" style="justify-items:center;text-align:center">

function App() {
  const s = useStore();
  const [tab, setTab] = useState(() => { const h = location.hash.slice(1); return ['home', 'calendar', 'stats', 'awards'].includes(h) ? h : 'home'; });
  const [sheet, setSheet] = useState(null);
  const [sheetOut, setSheetOut] = useState(false);
  const [pages, setPages] = useState([]);
  const [recap, setRecap] = useState(null);
  const [toast, setToast] = useState(null);
  const [unlocks, setUnlocks] = useState(null);
  const [auth, setAuth] = useState(() => (!s.meta.onboarded && !new URLSearchParams(location.search).has('embed') ? 'welcome' : null));
  const [dialog, setDialog] = useState(null);
  const toastT = useRef();
  const hostTheme = useRef(document.documentElement.getAttribute('data-theme'));
  const { c, res } = useMemo(() => evaluate(s), [s]);

  ui.sheet = v => { setSheetOut(false); setSheet(v); };
  ui.page = p => setPages(ps => [...ps.filter(x => x !== p), p]);
  ui.recap = setRecap;
  ui.auth = step => setAuth(step || 'welcome');
  ui.dialog = setDialog;
  ui.unlock = ids => setTimeout(() => setUnlocks(u => (u ? [...u, ...ids] : ids)), 450);
  ui.toast = (text, action, kind = 'ok') => {
    clearTimeout(toastT.current);
    setToast({ text, action, kind, id: Date.now(), closing: false });
    toastT.current = setTimeout(() => { setToast(t => t && { ...t, closing: true }); toastT.current = setTimeout(() => setToast(null), 330); }, action ? 4500 : 2400);
  };

  useEffect(() => {
    const h = () => { const v = location.hash.slice(1); if (['home', 'calendar', 'stats', 'awards'].includes(v)) setTab(v); };
    addEventListener('hashchange', h);
    return () => removeEventListener('hashchange', h);
  }, []);
  useEffect(() => { try { history.replaceState(null, '', '#' + tab); } catch (e) {} }, [tab]);
  useEffect(() => {
    const r = document.documentElement, t = s.settings.theme;
    if (t === 'system') { hostTheme.current ? r.setAttribute('data-theme', hostTheme.current) : r.removeAttribute('data-theme'); } else r.setAttribute('data-theme', t);
    s.settings.motion === 'reduced' ? r.setAttribute('data-motion', 'reduced') : r.removeAttribute('data-motion');
  }, [s.settings.theme, s.settings.motion]);

  const tabs = [['home', 'home', 'Обзор'], ['calendar', 'calendar_month', 'Календарь'], ['stats', 'bar_chart', 'Статистика'], ['awards', 'emoji_events', 'Награды']];
  const tabBtn = ([id, icon, label]) => html`<button class="tab" aria-current=${tab === id ? 'page' : null} onClick=${() => { buzz(5); setTab(id); setPages([]); }}><${Icon} n=${icon} fill=${tab === id} /><span>${label}</span></button>`;
  const closePage = p => setPages(ps => ps.filter(x => x !== p));
  const sheetBody = close => {
    switch (sheet.kind) {
      case 'tx': return html`<${TxSheet} tx=${sheet.tx} preset=${sheet.preset} close=${close} />`;
      case 'ach': return html`<${AchSheet} id=${sheet.id} res=${res} close=${close} />`;
      case 'challenge': return html`<${ChallengeSheet} ch=${sheet.ch} close=${close} />`;
      case 'category': return html`<${CategorySheet} cat=${sheet.cat} close=${close} />`;
      case 'backup': return html`<${BackupSheet} close=${close} />`;
      case 'import': return html`<${ImportSheet} data=${sheet.data} close=${close} />`;
      case 'avatar': return html`<${AvatarSheet} close=${close} />`;
      case 'showcase': return html`<${ShowcaseSheet} slot=${sheet.slot} res=${res} close=${close} />`;
      case 'inst': return html`<${InstSheet} it=${sheet.it} close=${close} />`;
      case 'dep': return html`<${DepSheet} d=${sheet.d} close=${close} />`;
    }
  };
  return html`<div class=${'app' + (sheet && !sheetOut && !sheet.auto ? ' has-sheet' : '')}>
    <div class="stage">
      ${tab === 'home' && html`<${Home} key="home" s=${s} c=${c} />`}
      ${tab === 'calendar' && html`<${CalendarScreen} key="cal" s=${s} c=${c} />`}
      ${tab === 'stats' && html`<${Stats} key="stats" s=${s} c=${c} />`}
      ${tab === 'awards' && html`<${Awards} key="awards" s=${s} c=${c} res=${res} />`}
      <nav class="tabbar" aria-label="Разделы">
        ${tabBtn(tabs[0])}${tabBtn(tabs[1])}
        <button class="tab tab--add" aria-label="Новая запись" onClick=${() => { buzz(8); ui.sheet({ kind: 'tx' }); }}><${Icon} n="add_circle" fill /><span class="tab__label-wide">Новая запись</span><span class="tab__label-short">Добавить</span></button>
        ${tabBtn(tabs[2])}${tabBtn(tabs[3])}
      </nav>
      ${pages.map(p => html`<div key=${p}>${
        p === 'settings' ? html`<${Settings} s=${s} onClose=${() => closePage(p)} />`
        : p === 'profile' ? html`<${Profile} s=${s} c=${c} res=${res} onClose=${() => closePage(p)} />`
        : html`<${Categories} s=${s} onClose=${() => closePage(p)} />`}</div>`)}
    </div>
    ${sheet && html`<${Sheet} key=${sheet.kind + (sheet.tx?.id || sheet.id || sheet.it?.id || sheet.d?.id || '')} auto=${sheet.auto} onClosing=${() => setSheetOut(true)} onClose=${() => setSheet(null)}>${sheetBody}<//>`}
    ${recap != null && html`<${Recap} k=${recap} onClose=${() => { store.set(st => ({ meta: { ...st.meta, recapSeen: Math.max(st.meta.recapSeen ?? 0, recap) } })); setRecap(null); }} />`}
    ${unlocks && html`<${Unlock} ids=${unlocks} res=${res} onDone=${() => setUnlocks(null)} />`}
    ${auth && html`<${Auth} start=${auth} onClose=${() => setAuth(null)} />`}
    ${dialog && html`<${Dialog} d=${dialog} key=${dialog.title} onClose=${() => setDialog(null)} />`}
    ${toast && html`<div class=${'island' + (toast.closing ? ' is-closing' : '')} key=${toast.id} role="status">
      <${Icon} n=${toast.kind === 'error' ? 'error' : toast.kind === 'delete' ? 'delete' : 'check_circle'} style=${toast.kind === 'ok' ? '' : 'color:var(--red)'} />
      <span>${toast.text}</span>
      ${toast.action && html`<button onClick=${() => { toast.action.run(); setToast(null); }}>${toast.action.label}</button>`}
    </div>`}
  </div>`;
}

(async function boot() {
  let s = null;
  try { await idb.open(); s = await idb.get('state'); } catch (e) { idb.db = null; }
  if (!s || s.v !== SCHEMA) { s = makeDefault(); if (idb.db) idb.put('state', s).catch(() => {}); }
  store.s = s;
  render(html`<${App} />`, document.getElementById('root'));
})();
</script>
